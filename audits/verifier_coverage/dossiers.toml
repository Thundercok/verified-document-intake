# Direction A: dossier-level cross-document redundancy.
#
# A form is rarely processed alone. It arrives inside a hồ sơ (dossier) together with
# other documents, or it is checked against a card or a database at the counter. When
# one of those documents states the same fact (name, DOB, ID, address) in printed or
# signed digital form, it can verify the (often handwritten) value on the form.
#
# Each anchor is reached through a *channel*. Which channels exist depends on the
# deployment scenario (see SCENARIOS in audit.py):
#   submitted               legally required part of the dossier -> stays in the archive
#   submitted_conventional  not legally required, but customary (e.g. job dossiers)
#   public_registry         public lookup keyed by a field on the form (MST registry)
#   presented_print         shown at the counter, never copied; available only if the
#                           intake system photographs/scans it (printed OCR)
#   presented_chip          same card, read over NFC (ICAO 9303, signed by the issuer)
#   gov_db                  government database (CSDL quốc gia về dân cư, tax e-invoice
#                           portal); only for agencies with integration rights
#
# Match kinds:
#   exact      the anchor states this field in full and it must be identical -> strong
#   may_differ the anchor states it in full, but it may legitimately differ (person moved,
#              card older than the form). Agreement is strong evidence, but the check only
#              fires when the value did not change -> counted as partial.
#
# `record` groups anchors that are views of the same underlying record (the card's print
# and its chip). Two anchors with the same record are NOT independent and are counted as
# one verifier by the combined rule.

# ---------------------------------------------------------------------------------------
# Anchors
# ---------------------------------------------------------------------------------------
[anchors.cccd_print]
title = "Thẻ căn cước / CCCD, printed faces (original or photocopy)"
record = "cccd"
fields = ["ho_ten", "so_dinh_danh", "ngay_sinh", "gioi_tinh", "quoc_tich", "que_quan",
          "noi_dk_khai_sinh", "noi_cu_tru", "ngay_cap", "noi_cap", "ngay_het_han"]
note = """Card issued since 1/7/2024 (TT 16/2024/TT-BCA): front = ảnh, số định danh, họ tên,
ngày sinh, giới tính, quốc tịch; back = nơi cư trú, nơi đăng ký khai sinh, ngày cấp,
ngày hết hạn, QR, chip. Older CCCD (2016/2021) prints quê quán and nơi thường trú instead.
Gender and nationality on the new front are from prior knowledge, not re-verified."""
source = "https://hatinh.gov.vn/vi/bai-viet/chinh-thuc-co-mau-the-can-cuoc-moi-ap-dung-tu-ngay-0172024"

[anchors.cccd_chip]
title = "CCCD / thẻ căn cước chip (NFC, ICAO 9303, passive authentication)"
record = "cccd"
fields = ["ho_ten", "so_dinh_danh", "ngay_sinh", "gioi_tinh", "quoc_tich", "dan_toc",
          "ton_giao", "que_quan", "noi_thuong_tru", "ho_ten_cha", "ho_ten_me",
          "ho_ten_vo_chong", "ngay_cap", "ngay_het_han"]
note = """Field list from a provincial guide listing what a chip reader displays (DG13).
Whether the old 9-digit CMND number is in DG13 is unconfirmed, so it is not mapped.
QĐ 1091/QĐ-BTTTT: readers must not store data read from the chip."""
source = "https://sontrung.huongson.hatinh.gov.vn/portal/DinhKemTinBai/2023-03/3. HD sử dụng 07 phương thức_100536.pdf"

[anchors.giay_khai_sinh]
title = "Giấy khai sinh (copy)"
record = "khai_sinh"
fields = ["ho_ten", "gioi_tinh", "ngay_sinh", "noi_sinh", "que_quan", "dan_toc", "quoc_tich",
          "so_dinh_danh", "ho_ten_me", "nam_sinh_me", "ho_ten_cha", "nam_sinh_cha"]
note = """TT 04/2020/TT-BTP: name in capitals, DOB in digits and words. Parent name/year rows
are from prior knowledge of the template; verify against the TT 04/2020 annex."""
source = "https://luatvietnam.vn/bieu-mau/mau-giay-khai-sinh-571-32603-article.html"

[anchors.gcn_cho_o]
title = "Giấy tờ chứng minh chỗ ở hợp pháp (GCN quyền sử dụng đất / hợp đồng thuê)"
record = "cho_o"
fields = ["ho_ten_chu_so_huu", "so_dinh_danh_chu_so_huu", "dia_chi_cho_o"]
note = "Luật Cư trú 2020 Điều 21: dossier = tờ khai + proof of lawful residence."
source = "https://congan.bacgiang.gov.vn/uploads/files/Q-330-c-ng-khai-TTHC-l-nh-v-c-qu-n-l-c-tr-.pdf"

[anchors.mst_registry]
title = "Tax-registration lookup by MST (tracuunnt.gdt.gov.vn)"
record = "mst"
fields = ["ten_nnt", "dia_chi_tru_so"]
note = """Public, CAPTCHA-protected. Useful for organisations. Since 1/7/2025 an individual's
MST IS the 12-digit số định danh (TT 86/2024/TT-BTC), so individual MSTs carry no mod-11
check digit and their registry entries are not public."""
source = "https://hatinh.gov.vn/vi/bai-viet/tu-172025-su-dung-so-dinh-danh-ca-nhan-thay-cho-ma-so-thue"

[anchors.thong_bao_thue]
title = "Thông báo / quyết định của cơ quan thuế (what is being paid)"
record = "thong_bao"
fields = ["ten_nnt", "mst", "dia_chi", "so_thong_bao", "so_tien", "ma_chuong", "ma_tieu_muc"]
note = "Brought to the bank/KBNN counter; the payer may pay part of the amount."
source = ""

[anchors.csdl_dan_cu]
title = "CSDL quốc gia về dân cư (lookup by số định danh)"
record = "csdl"
fields = ["ho_ten", "so_dinh_danh", "ngay_sinh", "gioi_tinh", "quoc_tich", "dan_toc",
          "ton_giao", "que_quan", "noi_dk_khai_sinh", "noi_thuong_tru", "noi_o_hien_tai",
          "ho_ten_cha", "ho_ten_me", "ho_ten_vo_chong", "chu_ho", "quan_he_chu_ho",
          "tinh_trang_hon_nhan"]
note = """Agencies exploit it instead of asking for paper (khai sinh, kết hôn from 1/1/2026 per
NQ 66.7/2025/NQ-CP, cư trú, BHXH). With this access, identity fields need only the ID read
correctly; the rest can be looked up."""
source = "https://thuvienphapluat.vn/phap-luat/khi-dang-ky-ket-hon-giua-hai-nguoi-viet-nam-tu-112026-co-can-xin-giay-xac-nhan-tinh-trang-hon-nhan--242239.html"

[anchors.einvoice_portal]
title = "Original e-invoice XML (hoadondientu.gdt.gov.vn or provider lookup code)"
record = "einvoice"
fields = ["all"]
note = """NĐ 123/2020: invoices are electronic; a paper invoice is a print of a signed XML.
With the lookup code or a buyer account the original can be fetched, which makes OCR of
the content unnecessary."""
source = ""

