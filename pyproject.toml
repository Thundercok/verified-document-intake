[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verified-document-intake"
version = "0.1.0"
description = "Selective and verified on-device document intake: deterministic PDF/OCR primitives, uncertainty calibration, and selective abstention."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0.0"]
vision = [
    "pillow>=10.0.0",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "numpy>=2.0",
    "pillow>=10.0.0",
    "pypdf>=5.0.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
vlm = [
    "mlx-vlm>=0.8.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/document_intake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
